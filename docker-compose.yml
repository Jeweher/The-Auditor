# File: docker-compose.yml
# Purpose: Local/production orchestration for all TISAXAI services.

version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: tisaxai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tisaxai
      POSTGRES_PASSWORD: tisaxai
      POSTGRES_DB: tisaxai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tisaxai"]
      interval: 10s
      timeout: 5s
      retries: 5

  chromadb:
    image: chromadb/chroma:0.5.15
    container_name: tisaxai_chromadb
    restart: unless-stopped
    volumes:
      - chroma_data:/chroma/chroma
    ports:
      - "8001:8000"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tisaxai_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://tisaxai:tisaxai@postgres:5432/tisaxai
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_started
    volumes:
      - evidence_data:/app/data/evidence
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tisaxai_frontend
    restart: unless-stopped
    expose:
      - "80"

  nginx:
    image: nginx:1.27-alpine
    container_name: tisaxai_nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  chroma_data:
  evidence_data:
