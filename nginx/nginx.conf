# File: nginx/nginx.conf
# Purpose: Reverse proxy routing traffic to the frontend (static build) and
# backend (FastAPI) services. HTTPS/TLS certificate paths are wired here for
# Phase 10 (Hardening & Deployment) — left as placeholders referencing
# mounted volumes, filled in when certificates are provisioned.

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    client_max_body_size 30M;

    upstream backend_api {
        server backend:8000;
    }

    upstream frontend_app {
        server frontend:80;
    }

    server {
        listen 80;
        server_name _;

        location /api/ {
            proxy_pass http://backend_api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health {
            proxy_pass http://backend_api/health;
        }

        location / {
            proxy_pass http://frontend_app/;
            proxy_set_header Host $host;
        }
    }
}
